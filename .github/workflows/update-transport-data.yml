name: Update daily transport static data

on:
  workflow_dispatch:

  schedule:
    # 21:30 UTC = 05:30 Hong Kong time (UTC+8), every day.
    - cron: '30 21 * * *'

  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-transport-data.yml'
      - 'scripts/update-transport-data.mjs'

permissions:
  contents: write

# Never let two transport-data jobs write the generated JSON at the same time.
concurrency:
  group: daily-transport-static-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate, commit and push latest transport data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Generated JSON files must never be line-merged. If main changes while
          # this job is running, restart from the new main and regenerate them.
          for attempt in 1 2 3; do
            echo "Transport data update attempt ${attempt}/3"

            git fetch origin main
            git reset --hard origin/main

            node scripts/update-transport-data.mjs
            git add data/

            if git diff --cached --quiet; then
              echo "No static transport data changes."
              exit 0
            fi

            git commit -m "chore: update daily transport static data"

            if git push origin HEAD:main; then
              echo "Static transport data pushed successfully."
              exit 0
            fi

            echo "main changed before push; regenerating from the latest main instead of rebasing generated JSON."
          done

          echo "Unable to push after 3 regeneration attempts."
          exit 1
